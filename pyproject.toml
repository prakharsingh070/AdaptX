[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptx"
version = "0.1.0"
description = "ADAPT-X - Adaptive Dynamic Perception and Tracking (LiDAR risk-aware adaptive perception)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ADAPT-X Team" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Development / CI toolchain.
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Point-cloud geometry backend. NOT required for Phase 1 and NOT installed by
# default: Phase 1 performs no geometric processing, and Open3D wheel
# availability lags new CPython releases.
pointcloud = ["open3d>=0.18"]
# CARLA Python API. Optional by design - the application must start and the
# test suite must pass without CARLA installed.
carla = ["carla>=0.9.15"]

[project.scripts]
adaptx = "adaptx.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptx"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "N", "RUF"]
ignore = [
    "B008", # FastAPI dependency injection relies on calls in defaults.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "carla: tests that require a real CARLA server (deselected by default)",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
# No python_version pin: mypy uses the running interpreter. The numpy stubs
# shipped with the pinned NumPy require 3.12+ syntax, so pinning to 3.11 makes
# mypy fail to parse them.
files = ["src/adaptx"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["carla.*", "psutil.*"]
ignore_missing_imports = true
